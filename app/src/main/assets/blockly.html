
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ziblocks</title>

    <!-- Bibliotecas Blockly -->
    <script src="blockly/blockly_compressed.js"></script>
    <script src="blockly/blocks_compressed.js"></script>
    <script src="blockly/javascript_compressed.js"></script>
    <script src="blockly/msg/en.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
        }

        #blocklyDiv {
            height: 100%;
            width: 100%;
        }

        .blocklyToolbox {
            transition: transform .25s ease;
            transform: translateX(0);
        }

        .toolboxHidden {
            transform: translateX(-100%);
        }

        /* =====================================================
           ESTILO DAS CATEGORIAS DA TOOLBOX
           ===================================================== */

        .blocklyTreeRoot {
            padding: 28px 5px 100px !important;
        }

        .blocklyTreeRow {
            height: 52px !important;
            line-height: 52px !important;

            margin: 8px 6px !important;
            padding: 0 12px !important;

            border-radius: 12px !important;

            box-sizing: border-box;

            box-shadow:
                inset 0 2px 2px rgba(255,255,255,0.25),
                0 5px 0 rgba(0,0,0,0.25);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                filter 0.12s ease;
        }

        /* SAÍDAS - AZUL */

        .blocklyTreeRoot > .blocklyTreeRow:nth-of-type(1) {
            background: linear-gradient(
                180deg,
                #4D9AE8,
                #2164A8
            ) !important;
        }

        /* TEMPO - ROXO */

        .blocklyTreeRoot > .blocklyTreeRow:nth-of-type(2) {
            background: linear-gradient(
                180deg,
                #AC75E8,
                #7540B5
            ) !important;
        }

        /* CONDIÇÕES - VERDE */

        .blocklyTreeRoot > .blocklyTreeRow:nth-of-type(3) {
            background: linear-gradient(
                180deg,
                #65C77D,
                #298449
            ) !important;
        }

        /* TEXTO DAS CATEGORIAS */

        .blocklyTreeLabel {
            color: #FFFFFF !important;
            font-size: 28px !important;
            font-weight: bold !important;
        }

        /* EFEITO AO PASSAR O MOUSE */

        .blocklyTreeRow:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);

            box-shadow:
                inset 0 2px 2px rgba(255,255,255,0.3),
                0 6px 0 rgba(0,0,0,0.25);
        }

        /* CATEGORIA SELECIONADA */

        .blocklyTreeRow.blocklyTreeSelected {
            filter: brightness(1.15);

            box-shadow:
                inset 0 2px 3px rgba(0,0,0,0.15),
                0 2px 0 rgba(0,0,0,0.3);

            transform: translateY(3px);
        }

        /* EFEITO DE CLIQUE */

        .blocklyTreeRow:active {
            transform: translateY(4px);

            box-shadow:
                inset 0 3px 5px rgba(0,0,0,0.2),
                0 1px 0 rgba(0,0,0,0.2);
        }

        /* =====================================================
           BOTÕES COMPACTOS NO RODAPÉ DA TOOLBOX
           ===================================================== */

        .ziblocksToolboxActions {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 60px;

            display: flex;
            flex-direction: column;
            gap: 30px;

            padding: 8px;

            box-sizing: border-box;

            background: transparent;
            border-top: 1px solid rgba(255,255,255,0.10);

            z-index: 1000;
        }

        /* ESTILO BASE DOS BOTÕES */

        .ziblocksActionButton {
            width: 90%;
            height: 32px;
            min-height: 32px;
            margin: 0 auto;

            border: none;
            border-radius: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 2px 3px rgba(0,0,0,0.18);

            transition:
                filter 0.12s ease,
                transform 0.12s ease,
                opacity 0.2s ease;
        }

        /* BOTÃO DESABILITADO */

        .ziblocksActionButton:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(0.3);
            box-shadow: none;
        }

        /* ÍCONES */

        .ziblocksActionIcon {
            font-size: 15px;
            line-height: 1;
        }

        /* CONECTAR - LARANJA */

        .ziblocksConnect {
            background: #E9822B;
        }

        /* CARREGAR - AZUL ARROXEADO */

        .ziblocksUpload {
            background: #5055A5;
        }

        /* EFEITO AO TOCAR */

        .ziblocksActionButton:active:not(:disabled) {
            transform: scale(0.98);
            filter: brightness(0.92);
        }

        .ziblocksActionButton:hover:not(:disabled) {
            filter: brightness(1.08);
        }

    </style>
</head>

<body>

<div id="blocklyDiv"></div>

<!-- TOOLBOX -->
<xml id="toolbox" style="display: none">

    <category name="💡Saídas" colour="210">
        <block type="ziblocks_pino_digital"></block>
    </category>

    <category name=" ⏱ Tempo" colour="270">
        <block type="ziblocks_aguardar"></block>
    </category>

    <category name="⇄ Condições" colour="120">
        <block type="ziblocks_se"></block>
    </category>

</xml>

<script>

    // =====================================================
    // CONTROLE DOS PINOS DIGITAIS
    // =====================================================

    const PINOS_DIGITAIS = [
        ["D3", "3"],
        ["D4", "4"],
        ["D5", "5"],
        ["D6", "6"],
        ["D7", "7"],
        ["D8", "8"],
        ["D9", "9"],
        ["D10", "10"],
        ["D11", "11"],
        ["D12", "12"],
        ["D13", "13"]
    ];

    const PINOS_ENTRADA = [
        ["D3", "3"],
        ["D4", "4"],
        ["D5", "5"],
        ["D6", "6"]
    ];

    const PINOS_SAIDA_COM_IF = [
        ["D7", "7"],
        ["D8", "8"],
        ["D9", "9"],
        ["D10", "10"],
        ["D11", "11"],
        ["D12", "12"],
        ["D13", "13"]
    ];


    // =====================================================
    // VERIFICA SE EXISTE ALGUM BLOCO SE
    // =====================================================

    function existeBlocoSE() {

        if (typeof workspace === "undefined" || !workspace) {
            return false;
        }

        const blocos = workspace.getAllBlocks(false);

        return blocos.some(function(bloco) {
            return bloco.type === "ziblocks_se";
        });

    }


    // =====================================================
    // OBTÉM OS PINOS JÁ UTILIZADOS PELOS OUTROS IFs
    // =====================================================

    function obterPinosReservados(blocoIgnorado) {

        const reservados = new Set();

        if (typeof workspace === "undefined" || !workspace) {
            return reservados;
        }

        const blocos = workspace.getAllBlocks(false);

        blocos.forEach(function(bloco) {

            if (bloco.type !== "ziblocks_se") return;

            if (bloco === blocoIgnorado) return;

            const pino = bloco.getFieldValue("PINO");

            if (pino) {
                reservados.add(String(pino));
            }

        });

        return reservados;

    }


    // =====================================================
    // OPÇÕES DOS PINOS DE SAÍDA
    // =====================================================

    function obterOpcoesPinosSaida() {

        if (existeBlocoSE()) {
            return PINOS_SAIDA_COM_IF;
        }

        return PINOS_DIGITAIS;

    }


    // =====================================================
    // OPÇÕES DOS PINOS DOS IFs
    // =====================================================

    function obterOpcoesPinosSE(blocoAtual) {

        const reservados = obterPinosReservados(blocoAtual);

        const pinoAtual = String(
            blocoAtual.getFieldValue("PINO") || ""
        );

        const opcoes = PINOS_ENTRADA.filter(function(opcao) {

            return !reservados.has(opcao[1]) ||
                opcao[1] === pinoAtual;

        });

        if (opcoes.length === 0) {

            return [
                ["Sem pinos disponíveis", "0"]
            ];

        }

        return opcoes;

    }


    // =====================================================
    // VERIFICA CONFLITOS ENTRE ENTRADAS E SAÍDAS
    // =====================================================

    function existeConflitoComSaida() {

        if (typeof workspace === "undefined" || !workspace) {
            return false;
        }

        const blocos = workspace.getAllBlocks(false);

        return blocos.some(function(bloco) {

            if (bloco.type !== "ziblocks_pino_digital") {
                return false;
            }

            const pino = String(
                bloco.getFieldValue("PINO")
            );

            return ["3", "4", "5", "6"].includes(pino);

        });

    }


    // =====================================================
    // AVISOS ANDROID
    // =====================================================

    function mostrarAviso(mensagem) {

        if (window.AndroidBridge) {

            AndroidBridge.showToast(mensagem);

        } else {

            console.log(mensagem);

        }

    }


    // =====================================================
    // MUTATOR: OPÇÃO SENÃO
    // =====================================================

    Blockly.Blocks['ziblocks_se_mutator_container'] = {

        init: function() {

            this.appendDummyInput()
                .appendField("Configurar SE");

            this.appendStatementInput("STACK");

            this.setColour(120);
            this.contextMenu = false;

        }

    };


    Blockly.Blocks['ziblocks_se_mutator_senao'] = {

        init: function() {

            this.appendDummyInput()
                .appendField("Adicionar SENÃO");

            this.setPreviousStatement(true);
            this.setNextStatement(false);

            this.setColour(120);
            this.contextMenu = false;

        }

    };


    // =====================================================
    // BLOCO PRINCIPAL: SEMPRE / FAÇA
    // =====================================================

    Blockly.Blocks['ziblocks_sempre'] = {

        init: function() {

            this.appendDummyInput()
                .appendField("Sempre")
                .appendField("Faça");

            this.appendStatementInput("DO");

            this.setColour("#FFD43B");

            this.setTooltip(
                "Executa continuamente as instruções colocadas dentro deste bloco."
            );

            this.setDeletable(false);
            this.setMovable(true);

        }

    };


    // =====================================================
    // BLOCO: DEFINIR PINO DIGITAL
    // =====================================================

    Blockly.Blocks['ziblocks_pino_digital'] = {

        init: function() {

            this.appendDummyInput()
                .appendField("Definir pino")
                .appendField(
                    new Blockly.FieldDropdown(function() {
                        return obterOpcoesPinosSaida();
                    }),
                    "PINO"
                )
                .appendField("como")
                .appendField(
                    new Blockly.FieldDropdown([
                        ["LIGADO", "1"],
                        ["DESLIGADO", "0"]
                    ]),
                    "ESTADO"
                );

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(210);

            this.setTooltip(
                "Define o estado de uma saída digital."
            );

        }

    };


    // =====================================================
    // BLOCO: AGUARDAR
    // =====================================================

    Blockly.Blocks['ziblocks_aguardar'] = {

        init: function() {

            this.appendDummyInput()
                .appendField("Aguardar")
                .appendField(
                    new Blockly.FieldDropdown([
                        ["10 ms", "10"],
                        ["50 ms", "50"],
                        ["100 ms", "100"],
                        ["300 ms", "300"],
                        ["500 ms", "500"],
                        ["1 segundo", "1000"],
                        ["2 segundos", "2000"],
                        ["5 segundos", "5000"],
                        ["10 segundos", "10000"]
                    ]),
                    "TEMPO"
                );

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(270);

            this.setTooltip(
                "Aguarda o tempo selecionado antes de executar a próxima instrução."
            );

        }

    };


    // =====================================================
    // BLOCO: SE
    // =====================================================

    Blockly.Blocks['ziblocks_se'] = {

        init: function() {

            this.hasElse_ = false;

            const blocoAtual = this;

            this.appendDummyInput()
                .appendField("Se o pino")
                .appendField(
                    new Blockly.FieldDropdown(function() {
                        return obterOpcoesPinosSE(blocoAtual);
                    }),
                    "PINO"
                )
                .appendField("estiver")
                .appendField(
                    new Blockly.FieldDropdown([
                        ["LIGADO", "1"],
                        ["DESLIGADO", "0"]
                    ]),
                    "ESTADO"
                );

            this.appendStatementInput("DO")
                .appendField("faça");

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(120);

            this.setTooltip(
                "Executa as instruções se a condição for verdadeira."
            );

            this.setMutator(
                new Blockly.icons.MutatorIcon(
                    ['ziblocks_se_mutator_senao'],
                    this
                )
            );


            // =================================================
            // REGRAS DOS BLOCOS SE
            // =================================================

            this.setOnChange(function(event) {

                if (!this.workspace) return;

                if (
                    !event ||
                    event.type !== Blockly.Events.BLOCK_MOVE ||
                    event.blockId !== this.id
                ) {
                    return;
                }

                const bloco = this;

                // REGRA 1:
                // Impedir SE dentro do FAÇA ou SENÃO de outro SE.

                const paiEstrutural = bloco.getSurroundParent();

                if (
                    paiEstrutural &&
                    paiEstrutural.type === 'ziblocks_se'
                ) {
                    bloco.unplug(true);
                    return;
                }

                // REGRA 2:
                // Máximo de 4 blocos SE dentro do SEMPRE.

                const raiz = bloco.getRootBlock();

                if (raiz.type !== 'ziblocks_sempre') return;

                const todosBlocos = bloco.workspace.getAllBlocks(false);

                let quantidadeSE = 0;

                for (const b of todosBlocos) {

                    if (b.type !== 'ziblocks_se') continue;

                    if (b.getRootBlock() === raiz) {
                        quantidadeSE++;
                    }

                }

                // REGRA 3:
                // Se ultrapassar quatro, desconecta o bloco.

                if (quantidadeSE > 4) {

                    bloco.unplug(true);

                    mostrarAviso(
                        "Limite de condicionais atingido"
                    );

                    return;

                }

                // REGRA 4:
                // Impedir IF se já houver saída utilizando D3 a D6.

                if (existeConflitoComSaida()) {

                    bloco.unplug(true);

                    mostrarAviso(
                        "Altere as saídas D3 a D6 antes de adicionar um SE"
                    );

                    return;

                }

            });

        },


        mutationToDom: function() {

            var container = document.createElement('mutation');

            if (this.hasElse_) {
                container.setAttribute('else', '1');
            }

            return container;

        },


        domToMutation: function(xmlElement) {

            this.hasElse_ =
                xmlElement.getAttribute('else') === '1';

            this.updateShape_();

        },


        decompose: function(workspace) {

            var containerBlock =
                workspace.newBlock('ziblocks_se_mutator_container');

            containerBlock.initSvg();

            var connection =
                containerBlock.getInput('STACK').connection;

            if (this.hasElse_) {

                var elseBlock =
                    workspace.newBlock('ziblocks_se_mutator_senao');

                elseBlock.initSvg();

                connection.connect(elseBlock.previousConnection);

            }

            return containerBlock;

        },


        compose: function(containerBlock) {

            var itemBlock =
                containerBlock.getInputTargetBlock('STACK');

            this.hasElse_ = false;

            while (itemBlock) {

                if (itemBlock.type === 'ziblocks_se_mutator_senao') {
                    this.hasElse_ = true;
                }

                itemBlock = itemBlock.nextConnection &&
                    itemBlock.nextConnection.targetBlock();

            }

            this.updateShape_();

        },


        updateShape_: function() {

            if (this.hasElse_) {

                if (!this.getInput('ELSE')) {

                    this.appendStatementInput('ELSE')
                        .appendField('senão');

                }

            } else {

                if (this.getInput('ELSE')) {
                    this.removeInput('ELSE');
                }

            }

        }

    };


    // =====================================================
    // INICIALIZAÇÃO DO BLOCKLY
    // =====================================================

    var workspace = Blockly.inject('blocklyDiv', {

        toolbox: document.getElementById('toolbox'),

        media: 'blockly/media/',

        zoom: {
            controls: false,
            wheel: false,
            pinch: true,
            startScale: 1.0,
            maxScale: 2.5,
            minScale: 0.5,
            scaleSpeed: 1.2
        }

    });

    // Impede que a toolbox apague blocos quando eles forem soltos sobre ela.
    const toolbox = workspace.getToolbox();

    workspace.getComponentManager().removeCapability(
        toolbox.id,
        Blockly.ComponentManager.Capability.DELETE_AREA
    );


    // =====================================================
    // CRIAÇÃO DOS BOTÕES DA TOOLBOX
    // =====================================================

    function criarBotoesToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (!toolbox) {
            console.error("Não foi possível localizar a toolbox.");
            return;
        }

        if (toolbox.querySelector(".ziblocksToolboxActions")) {
            return;
        }

        // Cria o rodapé.
        const rodape = document.createElement("div");

        rodape.className = "ziblocksToolboxActions";


        // BOTÃO CONECTAR.

        const botaoConectar = document.createElement("button");

        botaoConectar.type = "button";
        botaoConectar.className =
            "ziblocksActionButton ziblocksConnect";

        botaoConectar.innerHTML = `
            <span class="ziblocksActionIcon">⚡</span>
            <span>Conectar</span>
        `;


        // BOTÃO CARREGAR.

        const botaoCarregar = document.createElement("button");

        botaoCarregar.type = "button";
        botaoCarregar.className =
            "ziblocksActionButton ziblocksUpload";

        botaoCarregar.innerHTML = `
            <span class="ziblocksActionIcon">📤</span>
            <span>Carregar</span>
        `;


        // =================================================
        // CONTROLE DE HABILITAÇÃO DOS BOTÕES
        // =================================================

        // Carregar começa desabilitado.
        botaoCarregar.disabled = true;

        // Conectar habilita Carregar.
        botaoConectar.addEventListener("click", function() {

            botaoCarregar.disabled = false;

        });

        // Carregar verifica o programa antes de permitir
        // o envio dos dados para a placa.
        botaoCarregar.addEventListener("click", function(event) {

            const blocos = workspace.getAllBlocks(false);

            // Obtém os blocos que pertencem ao Sempre / Faça.
            const blocosDentro = blocos.filter(function(bloco) {

                return bloco !== blocoSempre &&
                       bloco.getRootBlock() === blocoSempre;

            });


            // =================================================
            // REGRA 1: BLOCO PRINCIPAL VAZIO
            // =================================================

            if (blocosDentro.length === 0) {

                mostrarAviso(
                    "Não há blocos dentro do bloco Principal!"
                );

                event.preventDefault();
                event.stopImmediatePropagation();

                return;

            }


            // =================================================
            // REGRA 2: SOMENTE BLOCOS DE TEMPO
            // =================================================

            const somenteBlocosTempo = blocosDentro.every(function(bloco) {

                return bloco.type === "ziblocks_aguardar";

            });

            if (somenteBlocosTempo) {

                mostrarAviso(
                    "Não é possível carregar só blocos de Tempo!"
                );

                event.preventDefault();
                event.stopImmediatePropagation();

                return;

            }


            // =================================================
            // REGRA 3: BLOCOS FORA DO SEMPRE / FAÇA
            // =================================================

            const existemBlocosFora = blocos.some(function(bloco) {

                return bloco !== blocoSempre &&
                       bloco.getRootBlock() !== blocoSempre;

            });

            if (existemBlocosFora) {

                mostrarAviso(
                    "Existem blocos fora do Bloco Principal"
                );

                event.preventDefault();
                event.stopImmediatePropagation();

                return;

            }


            // =================================================
            // REGRA 4: CARREGAMENTO VÁLIDO
            // =================================================

            // Desabilita Carregar até Conectar ser pressionado novamente.
            botaoCarregar.disabled = true;

        });


        // Impede que os cliques nos botões sejam
        // interpretados como seleção da toolbox.

        rodape.addEventListener("pointerdown", function(event) {
            event.stopPropagation();
        });

        rodape.addEventListener("click", function(event) {
            event.stopPropagation();
        });


        // Adiciona os dois botões ao rodapé.

        rodape.appendChild(botaoConectar);
        rodape.appendChild(botaoCarregar);

        toolbox.appendChild(rodape);

    }


    // Aguarda o Blockly montar sua interface.
    setTimeout(criarBotoesToolbox, 300);


    // =====================================================
    // TESTE DE ÁUDIO DO BLOCKLY
    // =====================================================

    setTimeout(async function() {

        const audio = workspace.getAudioManager();

        console.log("1. Gerenciador:", audio);
        console.log("2. Está mudo:", audio.getMuted());

        try {

            await audio.load(
                ['blockly/media/click.mp3'],
                'teste'
            );

            console.log("3. Arquivo carregado!");

            await audio.play('teste');

            console.log("4. Comando de reprodução executado!");

        } catch (erro) {

            console.error("ERRO NO TESTE:", erro);

        }

    }, 1000);


    // =====================================================
    // CRIAÇÃO AUTOMÁTICA DO SEMPRE / FAÇA
    // =====================================================

    var blocoSempre = workspace.newBlock('ziblocks_sempre');

    blocoSempre.initSvg();
    blocoSempre.render();

    blocoSempre.setDeletable(false);
    blocoSempre.setMovable(true);

    blocoSempre.moveBy(10, 120);


    // =====================================================
    // FECHAR JANELA DA ENGRENAGEM
    // =====================================================

    function fecharMutatorAberto() {

        const blocos = workspace.getAllBlocks(false);

        blocos.forEach(function(bloco) {

            if (!bloco.getIcons) return;

            const icones = bloco.getIcons();

            icones.forEach(function(icone) {

                if (icone instanceof Blockly.icons.MutatorIcon) {

                    if (typeof icone.setBubbleVisible === "function") {
                        icone.setBubbleVisible(false);
                    }

                }

            });

        });

    }


    // =====================================================
    // CONTROLE DA TOOLBOX
    // =====================================================

    function abrirToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.remove("toolboxHidden");
        }

    }


    function fecharToolbox() {

        workspace.hideChaff();

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.add("toolboxHidden");
        }

    }


    // Fecha a toolbox ao iniciar.
    setTimeout(function() {
        fecharToolbox();
    }, 300);


    // =====================================================
    // FECHAR TOOLBOX AO ARRASTAR UM BLOCO
    // =====================================================

    workspace.addChangeListener(function(event) {

        if (event.type === Blockly.Events.BLOCK_DRAG) {
            fecharToolbox();
        }

    });


    // =====================================================
    // FECHAR MUTATOR E TOOLBOX AO TOCAR NA ÁREA BRANCA
    // =====================================================

    document.addEventListener("pointerdown", function(event) {

        const alvo = event.target;

        if (!(alvo instanceof Element)) return;

        const tocouNaAreaVazia = alvo.closest(
            ".blocklyMainBackground"
        );

        if (!tocouNaAreaVazia) return;

        fecharMutatorAberto();

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.add("toolboxHidden");
        }

    }, true);


    // =====================================================
    // FECHAR TOOLBOX DEPOIS DE ARRASTAR UM BLOCO DO FLYOUT
    // =====================================================

    let arrasteComecouNoFlyout = false;
    let arrasteInicioX = 0;
    let arrasteInicioY = 0;

    document.addEventListener("pointerdown", function(event) {

        const alvo = event.target;

        arrasteComecouNoFlyout =
            alvo instanceof Element &&
            !!alvo.closest(".blocklyFlyout");

        arrasteInicioX = event.clientX;
        arrasteInicioY = event.clientY;

    }, true);


    document.addEventListener("pointerup", function(event) {

        if (!arrasteComecouNoFlyout) return;

        arrasteComecouNoFlyout = false;

        const distanciaX =
            Math.abs(event.clientX - arrasteInicioX);

        const distanciaY =
            Math.abs(event.clientY - arrasteInicioY);

        if (distanciaX < 8 && distanciaY < 8) return;

        const destino = document.elementFromPoint(
            event.clientX,
            event.clientY
        );

        const terminouNoFlyout =
            destino instanceof Element &&
            !!destino.closest(".blocklyFlyout");

        if (!terminouNoFlyout) {
            fecharToolbox();
        }

    }, true);


    // =====================================================
    // CONTROLE DOS GESTOS NA TELA
    // =====================================================

    let inicioX = 0;
    let gestoPermitido = false;

    document.addEventListener("touchstart", function(e) {

        if (e.touches.length === 0) return;

        const alvo = e.target;

        const iniciouEmBloco =
            alvo instanceof Element &&
            !!alvo.closest(
                ".blocklyDraggable, .blocklyFlyout, .blocklyToolbox"
            );

        gestoPermitido = !iniciouEmBloco;

        inicioX = e.touches[0].clientX;

    }, { passive: true });


    document.addEventListener("touchend", function(e) {

        if (!gestoPermitido) return;

        gestoPermitido = false;

        if (e.changedTouches.length === 0) return;

        let fimX = e.changedTouches[0].clientX;

        if (fimX - inicioX > 80) {
            abrirToolbox();
        }

        if (inicioX - fimX > 80) {
            fecharToolbox();
        }

    }, { passive: true });


    // =====================================================
    // BOTÃO ANDROID
    // =====================================================

    function alternarToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (!toolbox) return;

        if (toolbox.classList.contains("toolboxHidden")) {
            abrirToolbox();
        } else {
            fecharToolbox();
        }

    }

</script>

</body>
</html>
