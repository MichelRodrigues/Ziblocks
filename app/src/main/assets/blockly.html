
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ziblocks</title>

    <!-- Bibliotecas Blockly -->
    <script src="blockly/blockly_compressed.js"></script>
    <script src="blockly/blocks_compressed.js"></script>
    <script src="blockly/javascript_compressed.js"></script>
    <script src="blockly/msg/en.js"></script>

    <style>
        /* =====================================================
           ESTRUTURA GERAL
           ===================================================== */

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
        }

        #blocklyDiv {
            height: 100%;
            width: 100%;
        }

        .blocklyToolbox {
            transition: transform 0.25s ease;
            transform: translateX(0);
        }

        .toolboxHidden {
            transform: translateX(-100%);
        }


        /* =====================================================
           CATEGORIAS DA TOOLBOX
           ===================================================== */

        .blocklyToolboxCategory,
        .blocklyToolboxCategoryLabel,
        .blocklyTreeLabel {
            font-size: 17px !important;
            font-family: Arial, sans-serif !important;
        }


        /* =====================================================
           BOTÕES DA TOOLBOX
           ===================================================== */

        .ziblocksToolboxActions {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 60px;

            display: flex;
            flex-direction: column;
            gap: 30px;

            padding: 8px;
            box-sizing: border-box;

            background: transparent;
            border-top: 1px solid rgba(255, 255, 255, 0.10);

            z-index: 1000;
        }

        .ziblocksActionButton {
            width: 90%;
            height: 42px;
            min-height: 42px;
            margin: 0 auto;

            border: none;
            border-radius: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.18);

            transition:
                filter 0.12s ease,
                transform 0.12s ease,
                opacity 0.2s ease;
        }

        .ziblocksActionButton:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(0.3);
            box-shadow: none;
        }

        .ziblocksActionIcon {
            font-size: 15px;
            line-height: 1;
        }

        .ziblocksConnect {
            background: #E9822B;
        }

        .ziblocksUpload {
            background: #5055A5;
        }

        .ziblocksActionButton:active:not(:disabled) {
            transform: scale(0.98);
            filter: brightness(0.92);
        }

        .ziblocksActionButton:hover:not(:disabled) {
            filter: brightness(1.08);
        }


        /* =====================================================
           JANELA DA SEQUÊNCIA BINÁRIA
           ===================================================== */

        .ziblocksBinaryOverlay {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.65);
            z-index: 10000;
        }

        .ziblocksBinaryWindow {
            width: 100%;
            max-width: 480px;

            background: #FFFFFF;
            border-radius: 16px;

            padding: 20px;
            box-sizing: border-box;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

            font-family: Arial, sans-serif;
        }

        .ziblocksBinaryTitle {
            margin: 0 0 8px;
            color: #20243A;
            font-size: 20px;
            font-weight: bold;
        }

        .ziblocksBinaryDescription {
            margin: 0 0 15px;
            color: #555;
            font-size: 14px;
            line-height: 1.4;
        }

        .ziblocksBinaryText {
            width: 100%;
            min-height: 120px;
            max-height: 35vh;

            padding: 12px;
            box-sizing: border-box;

            resize: vertical;

            border: 1px solid #CCD0DA;
            border-radius: 8px;

            background: #F5F6FA;
            color: #20243A;

            font-family: monospace;
            font-size: 16px;
            line-height: 1.6;

            overflow-wrap: anywhere;
        }

        .ziblocksBinaryButtons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .ziblocksBinaryButton {
            flex: 1;
            min-height: 42px;

            border: none;
            border-radius: 8px;

            color: white;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .ziblocksBinaryCopy {
            background: #5055A5;
        }

        .ziblocksBinaryClose {
            background: #777D8C;
        }

        .ziblocksBinaryButton:active {
            filter: brightness(0.9);
        }


        /* =====================================================
           JANELAS DE ARQUIVOS DO ZIBLOCKS
           ===================================================== */

        .ziblocksFileOverlay {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.55);

            z-index: 20000;
        }

        .ziblocksFileWindow {
            width: 100%;
            max-width: 380px;

            padding: 22px;
            box-sizing: border-box;

            background: #FFFFFF;
            border-radius: 16px;

            font-family: Arial, sans-serif;

            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .ziblocksFileTitle {
            margin: 0 0 18px;

            color: #252A3D;
            font-size: 21px;
        }

        .ziblocksFileLabel {
            display: block;
            margin-bottom: 8px;

            color: #555;
            font-size: 14px;
        }

        .ziblocksFileInput {
            width: 100%;
            height: 46px;

            padding: 0 12px;
            box-sizing: border-box;

            border: 1px solid #C9CED9;
            border-radius: 8px;

            font-size: 16px;
            outline: none;
        }

        .ziblocksFileInput:focus {
            border-color: #75B832;
        }

        .ziblocksFileButtons {
            display: flex;
            gap: 10px;

            margin-top: 20px;
        }

        .ziblocksFileButton {
            flex: 1;
            min-height: 44px;

            border: none;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .ziblocksFileCancel {
            background: #E8EAF0;
            color: #333;
        }

        .ziblocksFileConfirm {
            background: #75B832;
            color: #17210A;
        }


        /* =====================================================
           PAINEL LATERAL DE PROGRAMAS
           ===================================================== */

        .ziblocksProgramsPanel {
            position: fixed;
            border: 1px solid #D9D9D9;
            top: 0;
            right: 0;

            width: min(60vw, 360px);
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #FFFFFF;

            box-shadow: -5px 0 25px rgba(0,0,0,0.25);

            z-index: 20000;

            font-family: Arial, sans-serif;

            transform: translateX(110%);
            transition: transform 0.25s ease;
        }

        .ziblocksProgramsPanel.open {
            transform: translateX(0);
        }

        .ziblocksProgramsHeader {
            min-height: 64px;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #F2FB94;
        }

        .ziblocksProgramsHeader h2 {
            margin: 0;

            color: #20243A;
            font-size: 19px;
        }

        .ziblocksProgramsClose {
            border: none;
            background: transparent;

            font-size: 28px;
            color: #333;

            cursor: pointer;
        }

        .ziblocksProgramsList {
            flex: 1;

            padding: 10px;

            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .ziblocksProgramItem {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 12px 10px;
            margin-bottom: 7px;

            border: 1px solid #E2E5EC;
            border-radius: 9px;

            background: #FFFFFF;

            cursor: pointer;
        }

        .ziblocksProgramItem.selected {
            border: 2px solid #75B832;
            background: #F5FBEF;
        }

        .ziblocksProgramName {
            flex: 1;
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #252A3D;
            font-size: 15px;
            font-weight: bold;
        }

        .ziblocksProgramShare {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;
            border-radius: 8px;

            background: #EEF0F5;

            color: #333;

            cursor: pointer;
        }

        .ziblocksProgramShare svg {
            display: block;
        }

        .ziblocksProgramShare:active {
            filter: brightness(0.9);
        }

        .ziblocksProgramDelete {
            background: #FCEBEC;
            color: #C62828;
        }

        .ziblocksProgramsFooter {
            padding: 12px;

            border-top: 1px solid #E5E5E5;
        }

        .ziblocksProgramsOpen {
            width: 100%;
            height: 46px;

            border: none;
            border-radius: 9px;

            background: #75B832;
            color: #17210A;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .ziblocksProgramsOpen:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .ziblocksProgramsEmpty {
            padding: 35px 15px;

            color: #777;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
        }

    </style>
</head>

<body>

<div id="blocklyDiv"></div>

<!-- =====================================================
     TOOLBOX
     ===================================================== -->

<xml id="toolbox" style="display: none">

    <category name="💡Saídas" colour="210">
        <block type="ziblocks_pino_digital"></block>
    </category>

    <category name=" ⏱ Tempo" colour="270">
        <block type="ziblocks_aguardar"></block>
    </category>

    <category name="⇄ Condições" colour="120">
        <block type="ziblocks_se"></block>
    </category>

</xml>


<script>

    // =====================================================
    // CONTROLE DOS PINOS DIGITAIS
    // =====================================================

    const PINOS_DIGITAIS = [
        ["D3", "3"],
        ["D4", "4"],
        ["D5", "5"],
        ["D6", "6"],
        ["D7", "7"],
        ["D8", "8"],
        ["D9", "9"],
        ["D10", "10"],
        ["D11", "11"],
        ["D12", "12"],
        ["D13", "13"]
    ];

    const PINOS_ENTRADA = [
        ["D3", "3"],
        ["D4", "4"],
        ["D5", "5"],
        ["D6", "6"]
    ];

    const PINOS_SAIDA_COM_IF = [
        ["D7", "7"],
        ["D8", "8"],
        ["D9", "9"],
        ["D10", "10"],
        ["D11", "11"],
        ["D12", "12"],
        ["D13", "13"]
    ];


    // =====================================================
    // REFERÊNCIAS DOS BOTÕES DA TOOLBOX
    // =====================================================

    let botaoConectarToolbox = null;
    let botaoCarregarToolbox = null;


    // =====================================================
    // RETORNO DAS TRANSMISSÕES REALIZADAS PELO ANDROID
    // =====================================================

    // O aplicativo informa apenas o início e o término
    // da transmissão dos pulsos.
    //
    // Não existe confirmação de recebimento ou interpretação
    // do programa pela placa.
    //
    // A identificação de erros do programa é responsabilidade
    // da própria placa, por meio do LED de erro.


    function ziblocksTransmissaoIniciada(acao, mensagem) {

        // Conectar permanece sempre disponível.
        if (botaoConectarToolbox) {
            botaoConectarToolbox.disabled = false;
        }

        // Carregar fica bloqueado durante qualquer transmissão.
        if (botaoCarregarToolbox) {
            botaoCarregarToolbox.disabled = true;
        }
    }


    function ziblocksTransmissaoConcluida(acao, mensagem) {

        // Conectar permanece sempre disponível.
        if (botaoConectarToolbox) {
            botaoConectarToolbox.disabled = false;
        }

        if (acao === "conectar") {

            // A sequência de conexão terminou de ser transmitida.
            // Libera o botão Carregar.

            if (botaoCarregarToolbox) {
                botaoCarregarToolbox.disabled = false;
            }
        }

        if (acao === "carregar") {

            // A sequência do programa terminou de ser transmitida.
            // É necessário enviar Conectar novamente
            // antes de outro carregamento.

            if (botaoCarregarToolbox) {
                botaoCarregarToolbox.disabled = true;
            }
        }
    }


    function ziblocksTransmissaoErro(acao, mensagem) {

        // Este retorno trata somente de falhas na transmissão
        // realizada pelo aplicativo Android.
        //
        // Não representa erro de interpretação da placa.

        if (botaoConectarToolbox) {
            botaoConectarToolbox.disabled = false;
        }

        if (botaoCarregarToolbox) {
            botaoCarregarToolbox.disabled = acao === "carregar";
        }

        if (mensagem) {
            mostrarAviso(mensagem);
        }
    }


    // =====================================================
    // VERIFICA SE EXISTE ALGUM BLOCO SE
    // =====================================================

    function existeBlocoSE() {

        if (typeof workspace === "undefined" || !workspace) {
            return false;
        }

        const blocos = workspace.getAllBlocks(false);

        return blocos.some(function(bloco) {
            return bloco.type === "ziblocks_se";
        });
    }


    // =====================================================
    // OBTÉM OS PINOS JÁ UTILIZADOS PELOS OUTROS IFs
    // =====================================================

    function obterPinosReservados(blocoIgnorado) {

        const reservados = new Set();

        if (typeof workspace === "undefined" || !workspace) {
            return reservados;
        }

        const blocos = workspace.getAllBlocks(false);

        blocos.forEach(function(bloco) {

            if (bloco.type !== "ziblocks_se") return;
            if (bloco === blocoIgnorado) return;

            const pino = bloco.getFieldValue("PINO");

            if (pino) {
                reservados.add(String(pino));
            }
        });

        return reservados;
    }


    // =====================================================
    // OPÇÕES DOS PINOS DE SAÍDA
    // =====================================================

    function obterOpcoesPinosSaida() {

        if (existeBlocoSE()) {
            return PINOS_SAIDA_COM_IF;
        }

        return PINOS_DIGITAIS;
    }


    // =====================================================
    // OPÇÕES DOS PINOS DOS IFs
    // =====================================================

    function obterOpcoesPinosSE(blocoAtual) {

        const reservados = obterPinosReservados(blocoAtual);

        const pinoAtual = String(
            blocoAtual.getFieldValue("PINO") || ""
        );

        const opcoes = PINOS_ENTRADA.filter(function(opcao) {

            return !reservados.has(opcao[1]) ||
                opcao[1] === pinoAtual;
        });

        if (opcoes.length === 0) {
            return [
                ["Sem pinos disponíveis", "0"]
            ];
        }

        return opcoes;
    }


    // =====================================================
    // VERIFICA CONFLITOS ENTRE ENTRADAS E SAÍDAS
    // =====================================================

    function existeConflitoComSaida() {

        if (typeof workspace === "undefined" || !workspace) {
            return false;
        }

        const blocos = workspace.getAllBlocks(false);

        return blocos.some(function(bloco) {

            if (bloco.type !== "ziblocks_pino_digital") {
                return false;
            }

            const pino = String(
                bloco.getFieldValue("PINO")
            );

            return ["3", "4", "5", "6"].includes(pino);
        });
    }


    // =====================================================
    // AVISOS ANDROID
    // =====================================================

    function mostrarAviso(mensagem) {

        if (window.AndroidBridge) {
            AndroidBridge.showToast(mensagem);
        } else {
            alert(mensagem);
        }
    }


    /* =====================================================
       GERENCIADOR DE PROGRAMAS
       ===================================================== */

    let painelProgramas = null;

    let programasDisponiveis = [];

    let programaSelecionado = null;

    let janelaSalvarCodigo = null;


    // =====================================================
    // ABRIR JANELA SALVAR
    // =====================================================

    function abrirJanelaSalvar() {

        if (janelaSalvarCodigo) {
            janelaSalvarCodigo.remove();
        }

        const overlay = document.createElement("div");

        overlay.className = "ziblocksFileOverlay";

        const janela = document.createElement("div");

        janela.className = "ziblocksFileWindow";

        const titulo = document.createElement("h2");

        titulo.className = "ziblocksFileTitle";
        titulo.textContent = "Salvar programa";

        const label = document.createElement("label");

        label.className = "ziblocksFileLabel";
        label.textContent = "Nome do programa";

        const input = document.createElement("input");

        input.className = "ziblocksFileInput";
        input.type = "text";
        input.maxLength = 50;
        input.placeholder = "Digite um nome";

        const botoes = document.createElement("div");

        botoes.className = "ziblocksFileButtons";

        const cancelar = document.createElement("button");

        cancelar.className =
            "ziblocksFileButton ziblocksFileCancel";

        cancelar.textContent = "Cancelar";

        cancelar.onclick = fecharJanelaSalvar;

        const salvar = document.createElement("button");

        salvar.className =
            "ziblocksFileButton ziblocksFileConfirm";

        salvar.textContent = "Salvar";

        salvar.onclick = function() {

            const nome = input.value.trim();

            if (!nome) {

                mostrarAviso("Digite um nome para o programa.");

                input.focus();

                return;
            }

            if (
                !window.AndroidBridge ||
                typeof AndroidBridge.salvarPrograma !== "function"
            ) {

                mostrarAviso("Não foi possível acessar o armazenamento.");

                return;
            }

            try {

                const dom = Blockly.Xml.workspaceToDom(workspace);

                const conteudo = Blockly.Xml.domToText(dom);

                salvar.disabled = true;

                AndroidBridge.salvarPrograma(
                    nome,
                    conteudo
                );

            } catch (erro) {

                salvar.disabled = false;

                mostrarAviso(
                    "Não foi possível preparar o programa para salvar."
                );

                console.error(erro);

            }

        };

        botoes.appendChild(cancelar);
        botoes.appendChild(salvar);

        janela.appendChild(titulo);
        janela.appendChild(label);
        janela.appendChild(input);
        janela.appendChild(botoes);

        overlay.appendChild(janela);

        document.body.appendChild(overlay);

        janelaSalvarCodigo = overlay;

        overlay.addEventListener("click", function(event) {

            if (event.target === overlay) {
                fecharJanelaSalvar();
            }

        });

        input.focus();

    }


    // =====================================================
    // FECHAR JANELA SALVAR
    // =====================================================

    function fecharJanelaSalvar() {

        if (janelaSalvarCodigo) {

            janelaSalvarCodigo.remove();

            janelaSalvarCodigo = null;

        }

    }


    // =====================================================
    // RETORNO DO ANDROID APÓS SALVAR
    // =====================================================

    function ziblocksSalvamentoResultado(sucesso, mensagem) {

        if (sucesso) {

            fecharJanelaSalvar();

            mostrarAviso(mensagem);

            if (painelProgramas) {
                AndroidBridge.listarProgramas();
            }

        } else {

            mostrarAviso(mensagem);

            const botao = janelaSalvarCodigo?.querySelector(
                ".ziblocksFileConfirm"
            );

            if (botao) {
                botao.disabled = false;
            }

        }

    }


    // =====================================================
    // ABRIR PAINEL DE PROGRAMAS
    // =====================================================

    function abrirListaProgramas() {

        fecharPainelProgramas();

        const painel = document.createElement("div");

        painel.className = "ziblocksProgramsPanel";

        const cabecalho = document.createElement("div");

        cabecalho.className = "ziblocksProgramsHeader";

        const titulo = document.createElement("h2");

        titulo.textContent = "Meus códigos";

        const fechar = document.createElement("button");

        fechar.className = "ziblocksProgramsClose";
        fechar.textContent = "×";

        fechar.onclick = fecharPainelProgramas;

        cabecalho.appendChild(titulo);
        cabecalho.appendChild(fechar);

        const lista = document.createElement("div");

        lista.className = "ziblocksProgramsList";

        lista.innerHTML = `
            <div class="ziblocksProgramsEmpty">
                Carregando programas...
            </div>
        `;

        const rodape = document.createElement("div");

        rodape.className = "ziblocksProgramsFooter";

        const botaoAbrir = document.createElement("button");

        botaoAbrir.className = "ziblocksProgramsOpen";

        botaoAbrir.textContent = "Abrir código";

        botaoAbrir.disabled = true;

        botaoAbrir.onclick = abrirProgramaSelecionado;

        rodape.appendChild(botaoAbrir);

        painel.appendChild(cabecalho);
        painel.appendChild(lista);
        painel.appendChild(rodape);

        document.body.appendChild(painel);

        painelProgramas = painel;

        setTimeout(function() {
            painel.classList.add("open");
        }, 10);

        if (
            window.AndroidBridge &&
            typeof AndroidBridge.listarProgramas === "function"
        ) {

            AndroidBridge.listarProgramas();

        } else {

            lista.innerHTML = `
                <div class="ziblocksProgramsEmpty">
                    Não foi possível acessar os programas.
                </div>
            `;

        }

    }


    // =====================================================
    // FECHAR PAINEL
    // =====================================================

    function fecharPainelProgramas() {

        if (painelProgramas) {

            painelProgramas.remove();

            painelProgramas = null;

        }

        programasDisponiveis = [];

        programaSelecionado = null;

    }


    // =====================================================
    // RECEBER LISTA DO ANDROID
    // =====================================================

    function ziblocksListaProgramas(programas) {

        programasDisponiveis = Array.isArray(programas)
            ? programas
            : [];

        renderizarListaProgramas();

    }


    // =====================================================
    // DESENHAR LISTA DE PROGRAMAS
    // =====================================================

    function renderizarListaProgramas() {

        if (!painelProgramas) return;

        const lista = painelProgramas.querySelector(
            ".ziblocksProgramsList"
        );

        const botaoAbrir = painelProgramas.querySelector(
            ".ziblocksProgramsOpen"
        );

        lista.innerHTML = "";

        programaSelecionado = null;

        botaoAbrir.disabled = true;

        if (programasDisponiveis.length === 0) {

            lista.innerHTML = `
                <div class="ziblocksProgramsEmpty">
                    Você ainda não salvou nenhum programa.<br><br>
                    Toque em Salvar Código para guardar seu primeiro projeto!
                </div>
            `;

            return;
        }

        programasDisponiveis.forEach(function(programa) {

            const item = document.createElement("div");

            item.className = "ziblocksProgramItem";

            const nome = document.createElement("div");

            nome.className = "ziblocksProgramName";

            nome.textContent = programa.nome;


            // =================================================
            // BOTÃO COMPARTILHAR
            // =================================================

            const compartilhar = document.createElement("button");

            compartilhar.className = "ziblocksProgramShare";

            compartilhar.innerHTML = `
                <svg viewBox="0 0 24 24" width="22" height="22"
                     fill="currentColor" aria-hidden="true">
                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7
                    a3.27 3.27 0 0 0 0-1.39l7.05-4.11a3 3 0 1 0-.94-1.74

    // =====================================================
    // RECEBER PROGRAMA DO ANDROID
    // =====================================================

    function ziblocksProgramaAberto(nome, conteudo) {

        try {

            // Converte o texto XML em um documento DOM.
            const parser = new DOMParser();
            const dom = parser.parseFromString(conteudo, "text/xml");

            // Verifica se o XML possui erros de estrutura.
            if (dom.getElementsByTagName("parsererror").length > 0) {
                throw new Error("Arquivo XML inválido.");
            }

            // Verifica se o arquivo contém o bloco principal.
            const possuiPrincipal = Array.from(dom.documentElement.children).some(
                function(elemento) {

                    return elemento.tagName.toLowerCase() === "block" &&
                        elemento.getAttribute("type") === "ziblocks_sempre";

                }
            );

            if (!possuiPrincipal) {

                mostrarAviso(
                    "Este arquivo não contém um programa Ziblocks válido."
                );

                return;
            }

            // Limpa o programa atual.
            workspace.clear();

            // Reconstrói os blocos e suas conexões.
            Blockly.Xml.domToWorkspace(dom.documentElement, workspace);

            // Atualiza a referência do bloco principal.
            blocoSempre = workspace.getAllBlocks(false).find(
                function(bloco) {
                    return bloco.type === "ziblocks_sempre";
                }
            );

            workspace.render();

            fecharPainelProgramas();

            mostrarAviso(
                "Código " + nome + " aberto com sucesso!"
            );

        } catch (erro) {

            console.error("Erro ao abrir programa:", erro);

            mostrarAviso(
                "Não foi possível abrir esse código."
            );

        }

    }

                .appendField("faça");

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(120);

            this.setTooltip(
                "Executa as instruções se a condição for verdadeira."
            );

            this.setMutator(
                new Blockly.icons.MutatorIcon(
                    ["ziblocks_se_mutator_senao"],
                    this
                )
            );


            // =================================================
            // REGRAS DOS BLOCOS SE
            // =================================================

            this.setOnChange(function(event) {

                if (!this.workspace) return;

                if (
                    !event ||
                    event.type !== Blockly.Events.BLOCK_MOVE ||
                    event.blockId !== this.id
                ) {
                    return;
                }

                const bloco = this;

                // Impedir SE dentro do FAÇA ou SENÃO de outro SE.

                const paiEstrutural = bloco.getSurroundParent();

                if (
                    paiEstrutural &&
                    paiEstrutural.type === "ziblocks_se"
                ) {
                    bloco.unplug(true);
                    return;
                }

                // Máximo de 4 blocos SE dentro do SEMPRE.

                const raiz = bloco.getRootBlock();

                if (raiz.type !== "ziblocks_sempre") return;

                const todosBlocos = bloco.workspace.getAllBlocks(false);

                let quantidadeSE = 0;

                for (const b of todosBlocos) {

                    if (b.type !== "ziblocks_se") continue;

                    if (b.getRootBlock() === raiz) {
                        quantidadeSE++;
                    }
                }

                if (quantidadeSE > 4) {

                    bloco.unplug(true);

                    mostrarAviso(
                        "Limite de condicionais atingido"
                    );

                    return;
                }

                // Impedir IF se já houver saída utilizando D3 a D6.

                if (existeConflitoComSaida()) {

                    bloco.unplug(true);

                    mostrarAviso(
                        "Altere as saídas D3 a D6 antes de adicionar um SE"
                    );

                    return;
                }
            });
        },


        mutationToDom: function() {

            var container = document.createElement("mutation");

            if (this.hasElse_) {
                container.setAttribute("else", "1");
            }

            return container;
        },


        domToMutation: function(xmlElement) {

            this.hasElse_ =
                xmlElement.getAttribute("else") === "1";

            this.updateShape_();
        },


        decompose: function(workspace) {

            var containerBlock =
                workspace.newBlock("ziblocks_se_mutator_container");

            containerBlock.initSvg();

            var connection =
                containerBlock.getInput("STACK").connection;

            if (this.hasElse_) {

                var elseBlock =
                    workspace.newBlock("ziblocks_se_mutator_senao");

                elseBlock.initSvg();

                connection.connect(elseBlock.previousConnection);
            }

            return containerBlock;
        },


        compose: function(containerBlock) {

            var itemBlock =
                containerBlock.getInputTargetBlock("STACK");

            this.hasElse_ = false;

            while (itemBlock) {

                if (itemBlock.type === "ziblocks_se_mutator_senao") {
                    this.hasElse_ = true;
                }

                itemBlock = itemBlock.nextConnection &&
                    itemBlock.nextConnection.targetBlock();
            }

            this.updateShape_();
        },


        updateShape_: function() {

            if (this.hasElse_) {

                if (!this.getInput("ELSE")) {

                    this.appendStatementInput("ELSE")
                        .appendField("senão");
                }

            } else {

                if (this.getInput("ELSE")) {
                    this.removeInput("ELSE");
                }
            }
        }
    };

    // =====================================================
    // CODIFICAÇÃO BINÁRIA
    // =====================================================

    const CODIGOS_TEMPO = {
        "10": "0000",
        "50": "0001",
        "100": "0010",
        "300": "0011",
        "500": "0100",
        "1000": "0101",
        "2000": "0110",
        "5000": "0111",
        "10000": "1000"
    };


    // Converte um número para uma sequência binária
    // com quantidade fixa de bits.

    function paraBinario(valor, quantidadeBits) {

        return Number(valor)
            .toString(2)
            .padStart(quantidadeBits, "0");
    }


    // =====================================================
    // CODIFICA UM BLOCO INDIVIDUAL
    // =====================================================

    function codificarBloco(bloco) {

        if (bloco.type === "ziblocks_pino_digital") {

            const pino = Number(
                bloco.getFieldValue("PINO")
            );

            const estado = Number(
                bloco.getFieldValue("ESTADO")
            );

            const codigo = 2 * (pino - 3) + estado;

            return paraBinario(codigo, 5);
        }


        if (bloco.type === "ziblocks_aguardar") {

            const tempo = bloco.getFieldValue("TEMPO");

            const codigo = CODIGOS_TEMPO[tempo];

            if (!codigo) {
                throw new Error("Tempo não reconhecido: " + tempo);
            }

            return codigo;
        }


        throw new Error(
            "Tipo de bloco não reconhecido: " + bloco.type
        );
    }


    // =====================================================
    // CODIFICA UMA CONDIÇÃO SE
    // =====================================================

    function codificarCondicao(bloco) {

        const pino = Number(
            bloco.getFieldValue("PINO")
        );

        const estado = Number(
            bloco.getFieldValue("ESTADO")
        );

        const codigo = 2 * (pino - 3) + estado;

        return paraBinario(codigo, 3);
    }


    // =====================================================
    // CODIFICA UMA SEQUÊNCIA DE BLOCOS
    // =====================================================

    function codificarSequencia(primeiroBloco) {

        const grupos = [];

        let bloco = primeiroBloco;

        while (bloco) {

            if (bloco.type === "ziblocks_se") {

                const condicao = codificarCondicao(bloco);

                // Corpo do SE.

                const primeiroDO =
                    bloco.getInputTargetBlock("DO");

                const gruposDO =
                    codificarSequencia(primeiroDO);

                grupos.push(condicao);
                grupos.push(...gruposDO);


                // Marcador separador obrigatório.
                // É o complemento do último bit da condição.

                const separador =
                    condicao.endsWith("1") ? "0" : "1";

                grupos.push(separador);


                // Corpo do SENÃO, se existir.

                if (bloco.hasElse_) {

                    const primeiroELSE =
                        bloco.getInputTargetBlock("ELSE");

                    const gruposELSE =
                        codificarSequencia(primeiroELSE);

                    grupos.push(...gruposELSE);
                }


                // Marcador final da condicional.

                grupos.push("11");

            } else {

                grupos.push(codificarBloco(bloco));
            }

            bloco = bloco.getNextBlock();
        }

        return grupos;
    }


    // =====================================================
    // VALIDAÇÃO E GERAÇÃO DA SEQUÊNCIA DO PROGRAMA
    // =====================================================

    function gerarSequenciaPrograma() {

        const blocos = workspace.getAllBlocks(false);

        const blocosDentro = blocos.filter(function(bloco) {

            return bloco !== blocoSempre &&
                bloco.getRootBlock() === blocoSempre;
        });


        // Deve existir pelo menos uma instrução.

        if (blocosDentro.length === 0) {
            throw new Error(
                "Não há blocos dentro do bloco Principal!"
            );
        }


        // Não permitir blocos fora do Sempre / Faça.

        const existemBlocosFora = blocos.some(function(bloco) {

            return bloco !== blocoSempre &&
                bloco.getRootBlock() !== blocoSempre;
        });

        if (existemBlocosFora) {
            throw new Error(
                "Existem blocos fora do Bloco Principal"
            );
        }


        // Deve existir pelo menos uma saída digital.

        const existeSaida = blocosDentro.some(function(bloco) {
            return bloco.type === "ziblocks_pino_digital";
        });

        if (!existeSaida) {
            throw new Error(
                "O código precisa ter pelo menos uma saída digital!"
            );
        }


        // Validar condicionais.

        const blocosSE = blocosDentro.filter(function(bloco) {
            return bloco.type === "ziblocks_se";
        });

        if (blocosSE.length > 4) {
            throw new Error(
                "O limite é de quatro blocos SE!"
            );
        }

        const pinosSE = new Set();

        for (const blocoSE of blocosSE) {

            const pino = String(
                blocoSE.getFieldValue("PINO")
            );


            // Não permitir repetir pino de entrada.

            if (pinosSE.has(pino)) {
                throw new Error(
                    "O pino D" + pino +
                    " está sendo utilizado em mais de uma condição!"
                );
            }

            pinosSE.add(pino);


            // Somente D3 a D6 podem ser entradas.

            if (!["3", "4", "5", "6"].includes(pino)) {
                throw new Error(
                    "As condições só podem utilizar os pinos D3 a D6!"
                );
            }


            // O corpo do SE não pode estar vazio.

            if (!blocoSE.getInputTargetBlock("DO")) {
                throw new Error(
                    "Existe um bloco SE sem instruções dentro do FAÇA!"
                );
            }


            // O corpo do SENÃO não pode estar vazio.

            if (
                blocoSE.hasElse_ &&
                !blocoSE.getInputTargetBlock("ELSE")
            ) {
                throw new Error(
                    "Existe um bloco SE com SENÃO sem instruções!"
                );
            }


            // Não permitir condicionais aninhadas.

            const primeiroDO =
                blocoSE.getInputTargetBlock("DO");

            const primeiroELSE =
                blocoSE.getInputTargetBlock("ELSE");

            function verificarAninhamento(primeiro) {

                let atual = primeiro;

                while (atual) {

                    if (atual.type === "ziblocks_se") {
                        return true;
                    }

                    atual = atual.getNextBlock();
                }

                return false;
            }

            if (
                verificarAninhamento(primeiroDO) ||
                verificarAninhamento(primeiroELSE)
            ) {
                throw new Error(
                    "Não é permitido colocar um SE dentro de outro SE!"
                );
            }
        }


        // Se existem IFs, saídas só podem utilizar D7 a D13.

        if (blocosSE.length > 0) {

            const saidasInvalidas = blocosDentro.some(function(bloco) {

                if (bloco.type !== "ziblocks_pino_digital") {
                    return false;
                }

                const pino = Number(
                    bloco.getFieldValue("PINO")
                );

                return pino < 7 || pino > 13;
            });

            if (saidasInvalidas) {
                throw new Error(
                    "Quando existem condições SE, as saídas devem utilizar D7 a D13!"
                );
            }
        }


        // Não permitir programa composto apenas por esperas.

        const somenteBlocosTempo = blocosDentro.every(function(bloco) {
            return bloco.type === "ziblocks_aguardar";
        });

        if (somenteBlocosTempo) {
            throw new Error(
                "Não é possível carregar só blocos de Tempo!"
            );
        }


        // Gerar os grupos a partir do bloco principal.

        const primeiroBloco =
            blocoSempre.getInputTargetBlock("DO");

        return codificarSequencia(primeiroBloco);
    }


    // =====================================================
    // EXIBIÇÃO DA SEQUÊNCIA BINÁRIA
    // =====================================================

    function mostrarSequenciaBinaria(grupos) {

        // Remove janela anterior, caso exista.

        const janelaAnterior = document.querySelector(
            ".ziblocksBinaryOverlay"
        );

        if (janelaAnterior) {
            janelaAnterior.remove();
        }


        const overlay = document.createElement("div");
        overlay.className = "ziblocksBinaryOverlay";

        const janela = document.createElement("div");
        janela.className = "ziblocksBinaryWindow";

        const titulo = document.createElement("h2");
        titulo.className = "ziblocksBinaryTitle";
        titulo.textContent = "Sequência gerada";

        const descricao = document.createElement("p");
        descricao.className = "ziblocksBinaryDescription";
        descricao.textContent =
            "Confira os grupos binários gerados a partir do seu programa.";

        const campo = document.createElement("textarea");
        campo.className = "ziblocksBinaryText";
        campo.readOnly = true;
        campo.value = grupos.join(" ");

        const botoes = document.createElement("div");
        botoes.className = "ziblocksBinaryButtons";


        // BOTÃO COPIAR

        const botaoCopiar = document.createElement("button");

        botaoCopiar.className =
            "ziblocksBinaryButton ziblocksBinaryCopy";

        botaoCopiar.textContent = "Copiar";

        botaoCopiar.addEventListener("click", async function() {

            try {

                if (
                    navigator.clipboard &&
                    navigator.clipboard.writeText
                ) {

                    await navigator.clipboard.writeText(campo.value);

                } else {

                    campo.focus();
                    campo.select();

                    const copiou = document.execCommand("copy");

                    if (!copiou) {
                        throw new Error("Não foi possível copiar.");
                    }
                }

                botaoCopiar.textContent = "Copiado!";

                setTimeout(function() {
                    botaoCopiar.textContent = "Copiar";
                }, 1500);

            } catch (erro) {

                campo.focus();
                campo.select();

                mostrarAviso(
                    "Selecione e copie a sequência manualmente."
                );
            }
        });


        // BOTÃO FECHAR

        const botaoFechar = document.createElement("button");

        botaoFechar.className =
            "ziblocksBinaryButton ziblocksBinaryClose";

        botaoFechar.textContent = "Fechar";

        botaoFechar.addEventListener("click", function() {
            overlay.remove();
        });


        // Fechar ao tocar fora da janela.

        overlay.addEventListener("click", function(event) {

            if (event.target === overlay) {
                overlay.remove();
            }
        });


        // Montagem da janela.

        botoes.appendChild(botaoCopiar);
        botoes.appendChild(botaoFechar);

        janela.appendChild(titulo);
        janela.appendChild(descricao);
        janela.appendChild(campo);
        janela.appendChild(botoes);

        overlay.appendChild(janela);

        document.body.appendChild(overlay);

        campo.focus();
        campo.select();
    }


    // =====================================================
    // CRIAÇÃO DOS BOTÕES DA TOOLBOX
    // =====================================================

    function criarBotoesToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (!toolbox) {
            return;
        }

        if (toolbox.querySelector(".ziblocksToolboxActions")) {
            return;
        }

        const rodape = document.createElement("div");
        rodape.className = "ziblocksToolboxActions";


        // BOTÃO CONECTAR.

        const botaoConectar = document.createElement("button");

        botaoConectar.type = "button";

        botaoConectar.className =
            "ziblocksActionButton ziblocksConnect";

        botaoConectar.innerHTML = `
            <span class="ziblocksActionIcon">⚡</span>
            <span>Conectar</span>
        `;


        // BOTÃO CARREGAR.

        const botaoCarregar = document.createElement("button");

        botaoCarregar.type = "button";

        botaoCarregar.className =
            "ziblocksActionButton ziblocksUpload";

        botaoCarregar.innerHTML = `
            <span class="ziblocksActionIcon">📤</span>
            <span>Carregar</span>
        `;


        // Guarda as referências para os callbacks do Android.

        botaoConectarToolbox = botaoConectar;
        botaoCarregarToolbox = botaoCarregar;


        // Estado inicial dos botões.

        botaoConectar.disabled = false;
        botaoCarregar.disabled = true;


        // =================================================
        // CONECTAR
        // =================================================

        botaoConectar.addEventListener("click", function(event) {

            event.preventDefault();
            event.stopPropagation();

            if (
                !window.AndroidBridge ||
                typeof AndroidBridge.transmitir !== "function"
            ) {

                mostrarAviso(
                    "Não foi possível acessar a transmissão Android."
                );

                return;
            }

            // Conectar permanece sempre disponível.
            // Bloqueia somente Carregar durante o envio.

            botaoCarregar.disabled = true;

            // Sequência de conexão: oito zeros.

            AndroidBridge.transmitir(
                "00000000",
                "conectar"
            );
        });


        // =================================================
        // CARREGAR
        // =================================================

        botaoCarregar.addEventListener("click", function(event) {

            event.preventDefault();
            event.stopPropagation();

            if (botaoCarregar.disabled) return;

            if (
                !window.AndroidBridge ||
                typeof AndroidBridge.transmitir !== "function"
            ) {

                mostrarAviso(
                    "Não foi possível acessar a transmissão Android."
                );

                return;
            }

            try {

                // Gera os grupos binários a partir dos blocos.

                const grupos = gerarSequenciaPrograma();

                const sequencia = grupos.join(" ");

                // Bloqueia Carregar durante a transmissão.
                // Conectar permanece disponível.

                botaoCarregar.disabled = true;

                // Solicita ao Android a transmissão dos grupos.
                // Os espaços separam os grupos, conforme o protocolo.

                AndroidBridge.transmitir(
                    sequencia,
                    "carregar"
                );

            } catch (erro) {

                mostrarAviso(erro.message);
            }
        });


        // Impede que os cliques nos botões sejam
        // interpretados como seleção da toolbox.

        rodape.addEventListener("pointerdown", function(event) {
            event.stopPropagation();
        });

        rodape.addEventListener("click", function(event) {
            event.stopPropagation();
        });


        // Adiciona os botões ao rodapé.

        rodape.appendChild(botaoConectar);
        rodape.appendChild(botaoCarregar);

        toolbox.appendChild(rodape);
    }


    // Aguarda o Blockly montar sua interface.

    setTimeout(criarBotoesToolbox, 300);


    // =====================================================
    // CRIAÇÃO AUTOMÁTICA DO SEMPRE / FAÇA
    // =====================================================

    var blocoSempre = workspace.newBlock("ziblocks_sempre");

    blocoSempre.initSvg();
    blocoSempre.render();

    blocoSempre.setDeletable(false);
    blocoSempre.setMovable(true);

    blocoSempre.moveBy(10, 120);


    // =====================================================
    // FECHAR JANELA DA ENGRENAGEM
    // =====================================================

    function fecharMutatorAberto() {

        const blocos = workspace.getAllBlocks(false);

        blocos.forEach(function(bloco) {

            if (!bloco.getIcons) return;

            const icones = bloco.getIcons();

            icones.forEach(function(icone) {

                if (icone instanceof Blockly.icons.MutatorIcon) {

                    if (typeof icone.setBubbleVisible === "function") {
                        icone.setBubbleVisible(false);
                    }
                }
            });
        });
    }


    // =====================================================
    // CONTROLE DA TOOLBOX
    // =====================================================

    function abrirToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.remove("toolboxHidden");
        }
    }


    function fecharToolbox() {

        workspace.hideChaff();

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.add("toolboxHidden");
        }
    }


    // Fecha a toolbox ao iniciar.

    setTimeout(function() {
        fecharToolbox();
    }, 300);


    // =====================================================
    // FECHAR TOOLBOX AO ARRASTAR UM BLOCO
    // =====================================================

    workspace.addChangeListener(function(event) {

        if (event.type === Blockly.Events.BLOCK_DRAG) {
            fecharToolbox();
        }
    });


    // =====================================================
    // FECHAR MUTATOR E TOOLBOX AO TOCAR NA ÁREA BRANCA
    // =====================================================

    document.addEventListener("pointerdown", function(event) {

        const alvo = event.target;

        if (!(alvo instanceof Element)) return;

        const tocouNaAreaVazia = alvo.closest(
            ".blocklyMainBackground"
        );

        if (!tocouNaAreaVazia) return;

        fecharMutatorAberto();

        const toolbox = document.querySelector(".blocklyToolbox");

        if (toolbox) {
            toolbox.classList.add("toolboxHidden");
        }

    }, true);


    // =====================================================
    // FECHAR TOOLBOX DEPOIS DE ARRASTAR UM BLOCO DO FLYOUT
    // =====================================================

    let arrasteComecouNoFlyout = false;
    let arrasteInicioX = 0;
    let arrasteInicioY = 0;

    document.addEventListener("pointerdown", function(event) {

        const alvo = event.target;

        arrasteComecouNoFlyout =
            alvo instanceof Element &&
            !!alvo.closest(".blocklyFlyout");

        arrasteInicioX = event.clientX;
        arrasteInicioY = event.clientY;

    }, true);


    document.addEventListener("pointerup", function(event) {

        if (!arrasteComecouNoFlyout) return;

        arrasteComecouNoFlyout = false;

        const distanciaX =
            Math.abs(event.clientX - arrasteInicioX);

        const distanciaY =
            Math.abs(event.clientY - arrasteInicioY);

        if (distanciaX < 8 && distanciaY < 8) return;

        const destino = document.elementFromPoint(
            event.clientX,
            event.clientY
        );

        const terminouNoFlyout =
            destino instanceof Element &&
            !!destino.closest(".blocklyFlyout");

        if (!terminouNoFlyout) {
            fecharToolbox();
        }

    }, true);


    // =====================================================
    // CONTROLE DOS GESTOS NA TELA
    // =====================================================

    let inicioX = 0;
    let gestoPermitido = false;

    document.addEventListener("touchstart", function(e) {

        if (e.touches.length === 0) return;

        const alvo = e.target;

        const iniciouEmBloco =
            alvo instanceof Element &&
            !!alvo.closest(
                ".blocklyDraggable, .blocklyFlyout, .blocklyToolbox"
            );

        gestoPermitido = !iniciouEmBloco;

        inicioX = e.touches[0].clientX;

    }, { passive: true });


    document.addEventListener("touchend", function(e) {

        if (!gestoPermitido) return;

        gestoPermitido = false;

        if (e.changedTouches.length === 0) return;

        let fimX = e.changedTouches[0].clientX;

        if (fimX - inicioX > 80) {
            abrirToolbox();
        }

        if (inicioX - fimX > 80) {
            fecharToolbox();
        }

    }, { passive: true });


    // =====================================================
    // BOTÃO ANDROID
    // =====================================================

    function alternarToolbox() {

        const toolbox = document.querySelector(".blocklyToolbox");

        if (!toolbox) return;

        if (toolbox.classList.contains("toolboxHidden")) {
            abrirToolbox();
        } else {
            fecharToolbox();
        }
    }

</script>

</body>
</html>
