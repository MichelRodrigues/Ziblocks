<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>Blockly Demo</title>
   <script src="blockly/blockly_compressed.js"></script>
   <script src="blockly/blocks_compressed.js"></script>
   <script src="blockly/javascript_compressed.js"></script>
    <script src="blockly/msg/en.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #blocklyDiv {
            height: 100%;
            width: 100%;
        }

        /* Toolbox deslizante */
        .blocklyToolbox{
            transition: transform .25s ease;
        }

        /* Escondida */
        .toolboxHidden{
            transform: translateX(-100%);
        }
    </style>
</head>
<body>
   <div id="blocklyDiv"></div>
   <xml id="toolbox" style="display: none">
       <category name="Logic" colour="%{BKY_LOGIC_HUE}">
           <block type="controls_if"></block>
           <block type="logic_compare"></block>
           <block type="logic_operation"></block>
           <block type="logic_negate"></block>
           <block type="logic_boolean"></block>
           <block type="logic_null"></block>
           <block type="logic_ternary"></block>
       </category>
       <category name="Loops" colour="%{BKY_LOOPS_HUE}">
           <block type="controls_repeat_ext">
               <value name="TIMES">
                   <block type="math_number">
                       <field name="NUM">10</field>
                   </block>
               </value>
           </block>
           <block type="controls_whileUntil"></block>
           <block type="controls_for">
               <value name="FROM">
                   <block type="math_number">
                       <field name="NUM">1</field>
                   </block>
               </value>
               <value name="TO">
                   <block type="math_number">
                       <field name="NUM">10</field>
                   </block>
               </value>
               <value name="BY">
                   <block type="math_number">
                       <field name="NUM">1</field>
                   </block>
               </value>
           </block>
           <block type="controls_forEach"></block>
           <block type="controls_flow_statements"></block>
       </category>
       <category name="Math" colour="%{BKY_MATH_HUE}">
           <block type="math_number"></block>
           <block type="math_arithmetic"></block>
           <block type="math_single"></block>
           <block type="math_trig"></block>
           <block type="math_constant"></block>
           <block type="math_number_property"></block>
           <block type="math_round"></block>
           <block type="math_on_list"></block>
           <block type="math_modulo"></block>
           <block type="math_constrain">
               <value name="LOW">
                   <block type="math_number">
                       <field name="NUM">1</field>
                   </block>
               </value>
               <value name="HIGH">
                   <block type="math_number">
                       <field name="NUM">100</field>
                   </block>
               </value>
           </block>
           <block type="math_random_int">
               <value name="FROM">
                   <block type="math_number">
                       <field name="NUM">1</field>
                   </block>
               </value>
               <value name="TO">
                   <block type="math_number">
                       <field name="NUM">100</field>
                   </block>
               </value>
           </block>
           <block type="math_random_float"></block>
       </category>
       <category name="Text" colour="%{BKY_TEXTS_HUE}">
           <block type="text"></block>
           <block type="text_join"></block>
           <block type="text_append">
               <value name="TEXT">
                   <block type="text"></block>
               </value>
           </block>
           <block type="text_length"></block>
           <block type="text_isEmpty"></block>
           <block type="text_indexOf">
               <value name="VALUE">
                   <block type="variables_get">
                       <field name="VAR">text</field>
                   </block>
               </value>
           </block>
           <block type="text_charAt">
               <value name="VALUE">
                   <block type="variables_get">
                       <field name="VAR">text</field>
                   </block>
               </value>
           </block>
           <block type="text_getSubstring">
               <value name="STRING">
                   <block type="variables_get">
                       <field name="VAR">text</field>
                   </block>
               </value>
           </block>
           <block type="text_changeCase"></block>
           <block type="text_trim"></block>
           <block type="text_print"></block>
           <block type="text_prompt_ext">
               <value name="TEXT">
                   <block type="text"></block>
               </value>
           </block>
       </category>
       <category name="Lists" colour="%{BKY_LISTS_HUE}">
           <block type="lists_create_with"></block>
           <block type="lists_create_with">
               <mutation items="0"></mutation>
           </block>
           <block type="lists_repeat">
               <value name="NUM">
                   <block type="math_number">
                       <field name="NUM">5</field>
                   </block>
               </value>
           </block>
           <block type="lists_length"></block>
           <block type="lists_isEmpty"></block>
           <block type="lists_indexOf">
               <value name="VALUE">
                   <block type="variables_get">
                       <field name="VAR">list</field>
                   </block>
               </value>
           </block>
           <block type="lists_getIndex">
               <value name="VALUE">
                   <block type="variables_get">
                       <field name="VAR">list</field>
                   </block>
               </value>
           </block>
           <block type="lists_setIndex">
               <value name="LIST">
                   <block type="variables_get">
                       <field name="VAR">list</field>
                   </block>
               </value>
           </block>
           <block type="lists_getSublist">
               <value name="LIST">
                   <block type="variables_get">
                       <field name="VAR">list</field>
                   </block>
               </value>
           </block>
           <block type="lists_split">
               <value name="DELIM">
                   <block type="text">
                       <field name="TEXT">,</field>
                   </block>
               </value>
           </block>
           <block type="lists_sort"></block>
       </category>
       <category name="Colour" colour="%{BKY_COLOUR_HUE}">
           <block type="colour_picker"></block>
           <block type="colour_random"></block>
           <block type="colour_rgb">
               <value name="RED">
                   <block type="math_number">
                       <field name="NUM">100</field>
                   </block>
               </value>
               <value name="GREEN">
                   <block type="math_number">
                       <field name="NUM">50</field>
                   </block>
               </value>
               <value name="BLUE">
                   <block type="math_number">
                       <field name="NUM">0</field>
                   </block>
               </value>
           </block>
           <block type="colour_blend">
               <value name="COLOUR1">
                   <block type="colour_picker">
                       <field name="COLOUR">#ff0000</field>
                   </block>
               </value>
               <value name="COLOUR2">
                   <block type="colour_picker">
                       <field name="COLOUR">#3333ff</field>
                   </block>
               </value>
               <value name="RATIO">
                   <block type="math_number">
                       <field name="NUM">0.5</field>
                   </block>
               </value>
           </block>
       </category>
       <category name="Variables" colour="%{BKY_VARIABLES_HUE}" custom="VARIABLE"></category>
       <category name="Functions" colour="%{BKY_PROCEDURES_HUE}" custom="PROCEDURE"></category>
   </xml>
   <script>

       var workspace = Blockly.inject('blocklyDiv',{
           toolbox: document.getElementById('toolbox'),
           media:'blockly/media/'
       });


       // Espera o Blockly criar a toolbox
       setTimeout(function(){

           const toolbox = document.querySelector(".blocklyToolbox");

           if(toolbox){
               toolbox.classList.add("toolboxHidden");
           }

       },300);




       function abrirToolbox(){

           const toolbox = document.querySelector(".blocklyToolbox");

           if(toolbox){
               toolbox.classList.remove("toolboxHidden");
           }

       }

       function fecharToolbox(){

           const toolbox = document.querySelector(".blocklyToolbox");

           if(toolbox){
               toolbox.classList.add("toolboxHidden");
           }

       }



       let inicioX = 0;

       document.addEventListener("touchstart",function(e){

           inicioX = e.touches[0].clientX;

       });

       workspace.addChangeListener(function(event){

           if(event.type === Blockly.Events.BLOCK_DRAG){

               fecharToolbox();

           }

       });


       document.addEventListener("touchend",function(e){

           let fimX = e.changedTouches[0].clientX;

           // esquerda -> direita
           if(fimX - inicioX > 80){

               abrirToolbox();

           }

           // direita -> esquerda
           if(inicioX - fimX > 80){

               fecharToolbox();

           }

       });

       function alternarToolbox(){

    const toolbox = document.querySelector(".blocklyToolbox");

    if(!toolbox) return;

    if(toolbox.classList.contains("toolboxHidden")){

        abrirToolbox();

    }else{

        fecharToolbox();

    }

}

   </script>
</body>
